[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "myproject"
dynamic = ["version"]                     # read from src/myproject/__init__.py, see below
description = "One line saying what the tool does"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/JeanMichelDurand/python-cli-template"
Issues = "https://github.com/JeanMichelDurand/python-cli-template/issues"
Changelog = "https://github.com/JeanMichelDurand/python-cli-template/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pyinstaller>=6", "ruff"]

[project.scripts]
myproject = "myproject.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "myproject.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]      # real errors (pyflakes) and layout (pycodestyle), no style preferences
